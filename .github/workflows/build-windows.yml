name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar informações do EXE (fornecedor e versão)
        shell: python
        run: |
          import os
          import re

          ref = os.environ.get("GITHUB_REF_NAME", "")
          m = re.match(r"v?(\d+)(?:\.(\d+))?(?:\.(\d+))?", ref)
          partes = [int(x) if x else 0 for x in m.groups()] if m else [1, 0, 0]
          partes = (partes + [0, 0, 0])[:3]
          versao = ".".join(map(str, partes))
          tupla = ", ".join(map(str, partes + [0]))

          conteudo = f"""# UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=({tupla}),
              prodvers=({tupla}),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  '041604B0',
                  [
                    StringStruct('CompanyName', 'HowtryX'),
                    StringStruct('FileDescription', 'Gerador de Etiquetas Vivo'),
                    StringStruct('FileVersion', '{versao}.0'),
                    StringStruct('InternalName', 'Gerador_Etiquetas_Vivo'),
                    StringStruct('LegalCopyright', 'Copyright (c) HowtryX'),
                    StringStruct('OriginalFilename', 'Gerador_Etiquetas_Vivo.exe'),
                    StringStruct('ProductName', 'Gerador de Etiquetas Vivo'),
                    StringStruct('ProductVersion', '{versao}.0'),
                  ]
                )
              ]),
              VarFileInfo([VarStruct('Translation', [1046, 1200])])
            ]
          )
          """

          with open("version_info.txt", "w", encoding="utf-8") as arquivo:
              arquivo.write(conteudo)

          print("Versão do EXE:", versao)

      - name: Gerar EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --hidden-import encodings.mac_roman `
            --version-file version_info.txt `
            --name "Gerador_Etiquetas_Vivo" `
            vivo_etiquetas.py

      - name: Guardar EXE (para testes manuais)
        uses: actions/upload-artifact@v4
        with:
          name: Gerador_Etiquetas_Vivo
          path: dist/Gerador_Etiquetas_Vivo.exe

      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Gerador_Etiquetas_Vivo.exe
          generate_release_notes: true
