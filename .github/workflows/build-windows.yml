name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Gerador_Etiquetas_Vivo" `
            vivo_etiquetas.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gerador_Etiquetas_Vivo
          path: dist/Gerador_Etiquetas_Vivo.exe
